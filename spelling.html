<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hayden's Storm Word Lab</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 16px;
  min-height: 100vh;
  font-family: Arial, Helvetica, sans-serif;
  background: linear-gradient(160deg,#dff4fb,#a9cfdd);
  color: #173746;
  text-align: center;
}

main {
  max-width: 800px;
  margin: auto;
  background: white;
  border-radius: 26px;
  padding: 22px 16px 32px;
  box-shadow: 0 10px 28px rgba(0,0,0,.15);
}

.badge {
  display: inline-block;
  background: #173746;
  color: white;
  padding: 9px 17px;
  border-radius: 30px;
  font-weight: bold;
}

h1 {
  margin: 14px 0 4px;
  font-size: clamp(34px,9vw,54px);
}

.subtitle {
  font-size: 19px;
  line-height: 1.4;
}

.progress {
  max-width: 430px;
  height: 16px;
  margin: 20px auto 8px;
  background: #dce8ed;
  border-radius: 20px;
  overflow: hidden;
}

#progressBar {
  height: 100%;
  width: 0%;
  background: #477f93;
  transition: width .3s;
}

#missionNumber {
  font-weight: bold;
}

.mission-card {
  max-width: 620px;
  margin: 18px auto;
  padding: 20px;
  border: 3px solid #6c98a8;
  border-radius: 24px;
  background: #eef8fc;
}

.mission-icon {
  font-size: 50px;
}

.instruction {
  font-size: 21px;
  font-weight: bold;
  margin: 10px;
}

/* WORD TO HEAR */

.word-card {
  display: block;
  width: 100%;
  max-width: 500px;
  margin: 18px auto;
  padding: 22px 15px;
  border: 4px solid #173746;
  border-radius: 22px;
  background: white;
  color: #173746;
  font-size: clamp(46px,13vw,78px);
  font-weight: 900;
  cursor: pointer;
}

.word-card:active {
  transform: scale(.97);
  background: #e7f7fc;
}

.listen-note {
  font-size: 17px;
  font-weight: bold;
}

/* ANSWER BUTTONS */

.choices {
  display: grid;
  grid-template-columns: repeat(2,1fr);
  gap: 12px;
  max-width: 520px;
  margin: 20px auto;
}

.choice {
  min-height: 75px;
  padding: 12px;
  border: 3px solid #173746;
  border-radius: 18px;
  background: white;
  color: #173746;
  font-size: clamp(25px,7vw,36px);
  font-weight: 900;
}

.choice:active {
  transform: scale(.96);
}

/* SPELLING LETTERS */

.letter-bank {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 10px;
  margin: 18px auto;
  max-width: 600px;
}

.letter {
  width: 62px;
  height: 62px;
  border: 3px solid #173746;
  border-radius: 16px;
  background: white;
  color: #173746;
  font-size: 31px;
  font-weight: 900;
}

.letter.used {
  opacity: .3;
}

.spelling-box {
  min-height: 80px;
  max-width: 520px;
  margin: 15px auto;
  padding: 15px;
  border: 4px dashed #6c98a8;
  border-radius: 20px;
  background: white;
  font-size: clamp(36px,10vw,58px);
  font-weight: 900;
  letter-spacing: 8px;
}

.small-button {
  margin: 7px;
  padding: 12px 17px;
  border: 2px solid #173746;
  border-radius: 14px;
  background: white;
  color: #173746;
  font-size: 17px;
  font-weight: bold;
}

#feedback {
  min-height: 55px;
  margin: 15px auto;
  font-size: 24px;
  font-weight: bold;
}

#next {
  display: none;
  margin: 12px auto;
  padding: 16px 26px;
  border: 0;
  border-radius: 18px;
  background: #173746;
  color: white;
  font-size: 22px;
  font-weight: bold;
}

.home {
  display: inline-block;
  margin-top: 25px;
  padding: 12px 18px;
  border: 2px solid #173746;
  border-radius: 15px;
  background: #edf8fc;
  color: #173746;
  text-decoration: none;
  font-weight: bold;
}

@media(max-width:400px) {
  .choices {
    grid-template-columns: 1fr 1fr;
  }

  .letter {
    width: 54px;
    height: 54px;
  }
}
</style>
</head>

<body>

<main>

<div class="badge">
📡 STORM WORD RADAR
</div>

<h1>Storm Word Lab</h1>

<p class="subtitle">
Hayden, the storm radar found hidden words.
Listen carefully and identify each word.
</p>

<div class="progress">
  <div id="progressBar"></div>
</div>

<p id="missionNumber"></p>

<section class="mission-card">

<div id="missionIcon" class="mission-icon">
📡
</div>

<div id="instruction" class="instruction">
Tap the word to hear it.
</div>

<button
  id="wordCard"
  class="word-card"
  type="button">
</button>

<div class="listen-note">
🔊 Tap the big word to hear it
</div>

<div id="activity"></div>

</section>

<div id="feedback" aria-live="polite"></div>

<button id="next" type="button">
Next Storm Word ➜
</button>

<br>

<a class="home" href="index.html">
⬅ Back to Storm Chasers Lab
</a>

</main>


<script>

/*
========================================
WEEKLY WORD LIST
Change these words when Hayden gets
new school words.
========================================
*/

const weeklyWords = [
  "the",
  "and",
  "can",
  "see",
  "like",
  "my",
  "to",
  "we",
  "go",
  "is"
];


/*
First 5 missions:
hear the word and identify it.

Last 5 missions:
hear the word and spell it.
*/

let current = 0;
let builtWord = "";
let currentLetters = [];


/* SPEAK WORD */

function speakWord(word) {

  if (!("speechSynthesis" in window)) {
    return;
  }

  window.speechSynthesis.cancel();

  const speech =
    new SpeechSynthesisUtterance(word);

  speech.rate = 0.72;
  speech.pitch = 1.05;
  speech.volume = 1;

  window.speechSynthesis.speak(speech);
}


/* SHUFFLE */

function shuffle(array) {

  const copy = [...array];

  for (let i = copy.length - 1; i > 0; i--) {

    const j =
      Math.floor(Math.random() * (i + 1));

    [copy[i], copy[j]] =
      [copy[j], copy[i]];
  }

  return copy;
}


/* WORD CARD */

document.getElementById("wordCard")
  .addEventListener("click", function() {

    speakWord(
      weeklyWords[current]
    );
  });


/* RENDER MISSION */

function renderMission() {

  const word =
    weeklyWords[current];

  document.getElementById(
    "missionNumber"
  ).textContent =
    "Word Mission " +
    (current + 1) +
    " of " +
    weeklyWords.length;


  document.getElementById(
    "wordCard"
  ).textContent =
    word;


  document.getElementById(
    "feedback"
  ).textContent =
    "";


  document.getElementById(
    "next"
  ).style.display =
    "none";


  const percent =
    (current / weeklyWords.length) * 100;

  document.getElementById(
    "progressBar"
  ).style.width =
    percent + "%";


  if (current < 5) {

    renderRecognition(word);

  } else {

    renderSpelling(word);
  }
}


/* RECOGNITION */

function renderRecognition(word) {

  document.getElementById(
    "instruction"
  ).textContent =
    "Listen to the word. Then find the matching word below.";


  document.getElementById(
    "missionIcon"
  ).textContent =
    "📡";


  let wrongWords =
    weeklyWords.filter(
      item => item !== word
    );

  wrongWords =
    shuffle(wrongWords)
      .slice(0,3);


  let choices =
    shuffle([
      word,
      ...wrongWords
    ]);


  const activity =
    document.getElementById(
      "activity"
    );

  activity.innerHTML =
    '<div class="choices"></div>';


  const choiceArea =
    activity.querySelector(
      ".choices"
    );


  choices.forEach(choice => {

    const button =
      document.createElement(
        "button"
      );

    button.type =
      "button";

    button.className =
      "choice";

    button.textContent =
      choice;

    button.addEventListener(
      "click",
      function() {

        checkRecognition(
          choice,
          word
        );
      }
    );

    choiceArea.appendChild(
      button
    );
  });
}


/* CHECK RECOGNITION */

function checkRecognition(
  answer,
  word
) {

  const feedback =
    document.getElementById(
      "feedback"
    );

  if (answer === word) {

    feedback.textContent =
      "✅ Correct! You found \"" +
      word +
      "\"!";

    speakWord(word);

    document.getElementById(
      "next"
    ).style.display =
      "inline-block";

  } else {

    feedback.textContent =
      "🌧️ Try again. Tap the big word and listen one more time.";

    speakWord(word);
  }
}


/* SPELLING */

function renderSpelling(word) {

  document.getElementById(
    "instruction"
  ).textContent =
    "Listen to the word. Then tap the letters to spell it.";


  document.getElementById(
    "missionIcon"
  ).textContent =
    "⛈️";


  builtWord = "";


  let letters =
    word.split("");


  const extras =
    "abcdefghijklmnopqrstuvwxyz"
      .split("");


  while (letters.length < 7) {

    const extra =
      extras[
        Math.floor(
          Math.random() *
          extras.length
        )
      ];

    letters.push(extra);
  }


  currentLetters =
    shuffle(letters);


  const activity =
    document.getElementById(
      "activity"
    );


  activity.innerHTML =
    `
    <div
      id="spellingBox"
      class="spelling-box">
      _
    </div>

    <div
      id="letterBank"
      class="letter-bank">
    </div>

    <button
      type="button"
      class="small-button"
      id="clearLetters">
      ↻ Start Over
    </button>

    <button
      type="button"
      class="small-button"
      id="checkSpelling">
      ✓ Check Word
    </button>
    `;


  buildLetterBank();


  document.getElementById(
    "clearLetters"
  ).addEventListener(
    "click",
    function() {

      builtWord = "";

      updateSpellingBox();

      buildLetterBank();
    }
  );


  document.getElementById(
    "checkSpelling"
  ).addEventListener(
    "click",
    function() {

      checkSpelling(word);
    }
  );
}


/* LETTER BANK */

function buildLetterBank() {

  const bank =
    document.getElementById(
      "letterBank"
    );

  bank.innerHTML = "";


  currentLetters.forEach(
    (letter,index) => {

      const button =
        document.createElement(
          "button"
        );

      button.type =
        "button";

      button.className =
        "letter";

      button.textContent =
        letter;


      button.addEventListener(
        "click",
        function() {

          if (
            button.classList.contains(
              "used"
            )
          ) {
            return;
          }

          builtWord += letter;

          button.classList.add(
            "used"
          );

          button.disabled =
            true;

          updateSpellingBox();
        }
      );


      bank.appendChild(
        button
      );
    }
  );
}


/* SPELLING DISPLAY */

function updateSpellingBox() {

  document.getElementById(
    "spellingBox"
  ).textContent =
    builtWord || "_";
}


/* CHECK SPELLING */

function checkSpelling(word) {

  const feedback =
    document.getElementById(
      "feedback"
    );


  if (
    builtWord.toLowerCase() ===
    word.toLowerCase()
  ) {

    feedback.textContent =
      "✅ Great spelling! " +
      word +
      " is correct!";

    speakWord(word);

    document.getElementById(
      "next"
    ).style.display =
      "inline-block";

  } else {

    feedback.textContent =
      "🌧️ Not yet. Listen again and rebuild the word.";

    speakWord(word);
  }
}


/* NEXT */

document.getElementById(
  "next"
).addEventListener(
  "click",
  function() {

    current++;

    if (
      current >=
      weeklyWords.length
    ) {

      completeMission();

      return;
    }

    renderMission();
  }
);


/* COMPLETE */

function completeMission() {

  document.getElementById(
    "progressBar"
  ).style.width =
    "100%";


  document.getElementById(
    "missionNumber"
  ).textContent =
    "Storm Word Training Complete";


  document.getElementById(
    "missionIcon"
  ).textContent =
    "🏆";


  document.getElementById(
    "instruction"
  ).textContent =
    "Excellent work, Hayden!";


  document.getElementById(
    "wordCard"
  ).style.display =
    "none";


  document.querySelector(
    ".listen-note"
  ).style.display =
    "none";


  document.getElementById(
    "activity"
  ).innerHTML =
    "<h2>You completed all 10 Storm Word missions!</h2>";


  document.getElementById(
    "feedback"
  ).textContent =
    "⭐ You earned 10 Storm Points!";


  document.getElementById(
    "next"
  ).style.display =
    "none";


  let points =
    Number(
      localStorage.getItem(
        "stormPoints"
      ) || 0
    );

  points += 10;

  localStorage.setItem(
    "stormPoints",
    points
  );
}


/* START */

renderMission();

</script>

</body>
</html>
